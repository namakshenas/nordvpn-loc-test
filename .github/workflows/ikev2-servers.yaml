name: UpdateIKEv2Servers

on:
  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download configs and extract servers.json
        working-directory: ikev2-sec-nord
        run: |
          curl -sSfL -o ovpn.zip https://downloads.nordcdn.com/configs/archives/servers/ovpn.zip
          unzip -q ovpn.zip 'ovpn_udp/*'
          bash ext_server_host.sh
          rm -rf ovpn.zip ovpn_udp

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update IKEv2 servers"
          file_pattern: 'ikev2-sec-nord/servers.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
